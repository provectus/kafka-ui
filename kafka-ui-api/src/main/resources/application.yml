auth:
  type: DISABLED

management:
  endpoint:
    info:
      enabled: true
    health:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "info,health,prometheus"

logging:
  level:
    root: INFO
    com.provectus: DEBUG
    reactor.netty.http.server.AccessLog: INFO
    org.hibernate.validator: WARN

# Spring Boot 4 migration: retain Jackson 2 compatibility while application code migrates.
spring:
  http:
    codecs:
      preferred-json-mapper: jackson2
